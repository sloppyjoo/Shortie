# Compiles Shortie on a Mac for every push, so a broken build shows up on
# GitHub before anyone opens Xcode. Nothing is signed or published.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild -project Shortie.xcodeproj -target Shortie -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 && status=0 || status=$?
          grep -E "error:|\*\* BUILD" build.log || tail -50 build.log
          exit $status

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
